[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
minfds=1024
minprocs=200

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
directory=/app
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cycle-worker]
command=celery -A app.worker.celery_app worker --loglevel=%(ENV_LOG_LEVEL)s --queues=celery --concurrency=2 --hostname=cycle@%%h
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:research-worker]
command=celery -A app.worker.celery_app worker --loglevel=%(ENV_LOG_LEVEL)s --queues=research --concurrency=1 --hostname=research@%%h
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=celery -A app.worker.celery_app beat --loglevel=%(ENV_LOG_LEVEL)s --schedule=/tmp/celerybeat-schedule
directory=/app
priority=30
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
