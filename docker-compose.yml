name: dyb-pro

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://dybpro:dybpro@db:5432/dybpro
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://objectstore:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dybpro}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-dybpro123}
  S3_BUCKET: ${S3_BUCKET:-dybpro}
  LOCAL_ARTIFACT_DIR: /data/artifacts
  APP_ENV: ${APP_ENV:-demo}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Devin / OpenAI credentials come from .env only — never baked into the image.
  DEVIN_API_KEY: ${DEVIN_API_KEY:-}
  DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
  DEVIN_API_BASE: ${DEVIN_API_BASE:-https://api.devin.ai}
  DEVIN_API_FLAVOR: ${DEVIN_API_FLAVOR:-v3}
  DEVIN_ORCHESTRATOR_ACU_LIMIT: ${DEVIN_ORCHESTRATOR_ACU_LIMIT:-8}
  DEVIN_CHILD_ACU_LIMIT: ${DEVIN_CHILD_ACU_LIMIT:-5}
  DEVIN_POLL_INTERVAL_SECONDS: ${DEVIN_POLL_INTERVAL_SECONDS:-10}
  DEVIN_SESSION_TIMEOUT_SECONDS: ${DEVIN_SESSION_TIMEOUT_SECONDS:-1800}
  ALLOW_LOCAL_SIMULATION: ${ALLOW_LOCAL_SIMULATION:-true}
  RESEARCH_DAEMON_ENABLED: ${RESEARCH_DAEMON_ENABLED:-true}
  RESEARCH_DEBOUNCE_SECONDS: ${RESEARCH_DEBOUNCE_SECONDS:-5}
  RESEARCH_TICK_SECONDS: ${RESEARCH_TICK_SECONDS:-15}
  RESEARCH_ACU_LIMIT: ${RESEARCH_ACU_LIMIT:-3}
  RESEARCH_MAX_TOPICS_PER_EVENT: ${RESEARCH_MAX_TOPICS_PER_EVENT:-4}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  SEED_ADMIN_API_KEY: ${SEED_ADMIN_API_KEY:-dyb-pro-demo-admin}
  SEED_SCIENTIST_API_KEY: ${SEED_SCIENTIST_API_KEY:-dyb-pro-demo-scientist}
  SEED_VIEWER_API_KEY: ${SEED_VIEWER_API_KEY:-dyb-pro-demo-viewer}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dybpro
      POSTGRES_PASSWORD: dybpro
      POSTGRES_DB: dybpro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dybpro"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dybpro}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dybpro123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "celery"]
    environment: *backend-env
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      api:
        condition: service_healthy

  # The research daemon: its own worker and its own beat, so it keeps reacting to changes while a
  # design cycle occupies the cycle worker for half an hour.
  research:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--beat", "--loglevel=INFO", "--concurrency=1", "-Q", "research"]
    environment: *backend-env
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      DYB_PRO_BACKEND_URL: http://api:8000
      DYB_PRO_API_KEY: ${SEED_SCIENTIST_API_KEY:-dyb-pro-demo-scientist}
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:-}
      APP_BASIC_AUTH_PASSWORD: ${APP_BASIC_AUTH_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  artifacts:
